<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holidays Management - Prophet Forecasting</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Prophet Forecasting Admin</div>
        <ul class="nav-menu">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/holidays" class="active">Holidays</a></li>
            <li><a href="/ramadan">Ramadan</a></li>
            <li><a href="/promotions">Promotions</a></li>
            <li><a href="/imports">Import Status</a></li>
        </ul>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Holidays Management</h1>
            <button class="btn btn-success" onclick="openModal()">Add Holiday</button>
        </div>

        <div class="form-group" style="max-width: 200px;">
            <label for="yearFilter">Filter by Year:</label>
            <select id="yearFilter" onchange="loadHolidays()">
                <option value="">All Years</option>
            </select>
        </div>

        <div id="message"></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Year</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Impact</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="holidaysTable">
                <tr><td colspan="8" class="text-center">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Holiday</h2>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <form id="holidayForm" onsubmit="saveHoliday(event)">
                <input type="hidden" id="holidayId">

                <div class="form-group">
                    <label for="holidayName">Holiday Name *</label>
                    <input type="text" id="holidayName" required>
                </div>

                <div class="form-group">
                    <label for="holidayType">Type *</label>
                    <select id="holidayType" required>
                        <option value="fixed">Fixed</option>
                        <option value="islamic">Islamic</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Year *</label>
                    <input type="number" id="year" required min="2020" max="2050">
                </div>

                <div class="form-group">
                    <label for="startDate">Start Date *</label>
                    <input type="date" id="startDate" required>
                </div>

                <div class="form-group">
                    <label for="endDate">End Date *</label>
                    <input type="date" id="endDate" required>
                </div>

                <div class="form-group">
                    <label for="impactMultiplier">Impact Multiplier</label>
                    <input type="number" id="impactMultiplier" step="0.1" value="1.0" min="0">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="isActive" checked> Active
                    </label>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/holidays.js"></script>
</body>
</html>
